name: Publish GitHub Package
run-name: Publish plugin image v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release version, without v (e.g. 0.1.3)'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: package-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Download the published plugin
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          # npm pack drops the @ and turns the / into a -, so the scoped name
          # packs as eottabom-istio-headlamp-plugin-<version>.tar.gz. The
          # directory inside the archive keeps the unscoped name.
          archive="$(node -p "require('./package.json').name.replace('@','').replace('/','-')")-${VERSION}.tar.gz"
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" --pattern "$archive"
          mkdir plugins
          tar -xzf "$archive" -C plugins
          test -s plugins/istio-headlamp-plugin/main.js
          test -s plugins/istio-headlamp-plugin/package.json
          node -e 'const expected = require("./package.json").name; const p = require("./plugins/istio-headlamp-plugin/package.json"); if (p.name !== expected || p.version !== process.env.VERSION) process.exit(1)'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` follows the newest stable release only. Re-publishing an older
      # version (the documented recovery for a failed image push) must not move
      # it backwards, and a pre-release is never `latest`.
      - name: Is this the latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          newest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          [ "$newest" = "v${VERSION}" ] && echo "enable=true" >>"$GITHUB_OUTPUT" || echo "enable=false" >>"$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.enable }}

      - name: Publish plugin image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
