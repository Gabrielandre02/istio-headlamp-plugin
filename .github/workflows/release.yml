name: Release

# Without this the Actions list shows a row of identical "Release" runs.
run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

# Versioning lives here rather than in a script on someone's laptop: you run
# this workflow with a version, and it does the bump, the tag, the release and
# the manifest update as one unit.
#
# The manifest matters more than it looks. ArtifactHub hosts nothing: it reads
# artifacthub/<version>/artifacthub-pkg.yml from the default branch, one
# directory per release so the catalogue keeps every version, and fetches the
# tarball named by archive-url, checking it against archive-checksum. If those disagree the
# plugin still appears in the catalogue but fails to install. So the checksum
# is taken from the tarball this job publishes, never guessed beforehand.
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Full history with tags: the changelog is the commits since the
          # previous tag, and the duplicate-tag check needs the tags present.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            v*) echo "drop the leading v: use ${VERSION#v}"; exit 1 ;;
          esac
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "'$VERSION' is not a semver version"
            exit 1
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists"
            exit 1
          fi

      - run: npm ci

      - name: Verify
        run: |
          npx prettier --check "src/**/*.{ts,tsx}"
          npm run lint
          npm run tsc
          npm test

      - name: Bump, build and package
        id: package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # npm version refuses to "bump" to the version already in the file,
          # which is exactly the case on a first release.
          if [ "$(node -p "require('./package.json').version")" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version >/dev/null
          fi
          npm run build
          npm run package >/dev/null
          # npm pack drops the @ and turns the / into a -, so a scoped name
          # such as @eottabom/istio-headlamp-plugin packs as
          # eottabom-istio-headlamp-plugin-<version>.tar.gz.
          name="$(node -p "require('./package.json').name.replace('@','').replace('/','-')")"
          tarball="${name}-${VERSION}.tar.gz"
          test -f "$tarball" || { echo "expected $tarball, got:"; ls -1 ./*.tar.gz; exit 1; }
          echo "tarball=$tarball" >>"$GITHUB_OUTPUT"
          echo "checksum=$(sha256sum "$tarball" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      # Each release gets its own manifest, started from the newest existing one
      # so descriptions, screenshots and install notes carry forward. Earlier
      # directories are never touched: their checksums match their tarballs.
      - name: Manifest for this version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          newest="$(ls artifacthub | sort -V | tail -n 1)"
          manifest="artifacthub/${VERSION}/artifacthub-pkg.yml"
          mkdir -p "artifacthub/${VERSION}"
          [ -f "$manifest" ] || cp "artifacthub/${newest}/artifacthub-pkg.yml" "$manifest"
          echo "MANIFEST=$manifest" >>"$GITHUB_ENV"

      - name: Update the manifest
        env:
          VERSION: ${{ inputs.version }}
          TARBALL: ${{ steps.package.outputs.tarball }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${TARBALL}"
          python3 - "$VERSION" "$url" "$CHECKSUM" <<'PY'
          import os, re, sys
          from datetime import datetime, timezone

          version, url, checksum = sys.argv[1:4]
          path = os.environ['MANIFEST']
          s = open(path).read()
          s = re.sub(r'^version: .*$', f'version: {version}', s, count=1, flags=re.M)
          # createdAt is what the catalogue prints as the update date, so it has
          # to move with the release rather than stay at the date the manifest
          # was first written.
          s = re.sub(
              r'^createdAt: .*$',
              f'createdAt: "{datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")}"',
              s,
              count=1,
              flags=re.M,
          )
          s = re.sub(r'(headlamp/plugin/archive-url: ).*$', rf'\1"{url}"', s, count=1, flags=re.M)
          s = re.sub(
              r'(headlamp/plugin/archive-checksum: ).*$',
              rf'\1"SHA256:{checksum}"',
              s,
              count=1,
              flags=re.M,
          )
          open(path, 'w').write(s)
          PY

          # The catalogue install instructions pin a version in a shell snippet. Left
          # alone they keep telling people to download the previous release.
          sed -i -E "s/^([[:space:]]*)VERSION=[0-9]+\.[0-9]+\.[0-9]+$/\1VERSION=${VERSION}/" \
            "$MANIFEST"

          # Keep the clickable release asset link in both install guides current.
          # Earlier manifests name the archive as it was packed then, which the
          # scoped package name changed, so match any archive name here.
          sed -i -E "s@releases/download/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?/[A-Za-z0-9._-]+\.tar\.gz@releases/download/v${VERSION}/${TARBALL}@g; s@\[(\`?)[A-Za-z0-9._-]*istio-headlamp-plugin-[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\.tar\.gz(\`?)\]@[\1${TARBALL}\3]@g" \
            "$MANIFEST"

          sed -i -E "s@(ghcr.io/${GITHUB_REPOSITORY}:)[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?@\1${VERSION}@g" \
            "$MANIFEST"

      # ArtifactHub renders `readme` as the package page. Regenerating it from
      # README.md here is what keeps the two from drifting: the manifest is
      # rewritten every release anyway, so the page follows the repository
      # without anyone remembering to copy it across. An inline field rather
      # than a README.md beside the manifest, which would commit a second copy
      # of the README for every release.
      - name: Package README for the catalogue
        run: python3 scripts/artifacthub-readme.py README.md --manifest "$MANIFEST"

      # Artifact Hub shows `changes` as the release's changelog in the catalogue.
      # Built from the conventional-commit subjects since the previous tag, so
      # it needs no hand-kept file: feat -> added, fix -> fixed, security ->
      # security. Anything else (docs, test, release, chore) stays out.
      - name: Changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          prev="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)"
          git log --no-merges --format=%s ${prev:+"$prev"..HEAD} >"$RUNNER_TEMP/subjects"
          python3 - "$RUNNER_TEMP/subjects" "$RUNNER_TEMP/notes.md" <<'PY'
          import os, re, sys

          kinds = {'feat': 'added', 'fix': 'fixed', 'security': 'security'}
          changes = []
          for line in open(sys.argv[1]):
              m = re.match(r'^(\w+)(?:\([^)]*\))?!?:\s*(.+)$', line.strip())
              if m and m.group(1) in kinds:
                  text = m.group(2)
                  changes.append((kinds[m.group(1)], text[0].upper() + text[1:]))
          changes.reverse()  # oldest first reads as a story

          path = os.environ['MANIFEST']
          s = open(path).read()
          s = re.sub(r'^changes:\n(?:[ -].*\n)*', '', s, flags=re.M)
          if changes:
              block = 'changes:\n' + ''.join(
                  f'  - kind: {k}\n    description: "{d.replace(chr(34), chr(39))}"\n'
                  for k, d in changes
              )
              s = re.sub(r'^links:', block + 'links:', s, count=1, flags=re.M)
          open(path, 'w').write(s)

          titles = {'added': 'Added', 'fixed': 'Fixed', 'security': 'Security'}
          with open(sys.argv[2], 'w') as out:
              for kind, title in titles.items():
                  items = [d for k, d in changes if k == kind]
                  if items:
                      out.write(f'### {title}\n\n' + ''.join(f'- {d}\n' for d in items) + '\n')
          PY
          cat "$RUNNER_TEMP/notes.md"

      - name: Commit, tag and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json "$MANIFEST"
          # Nothing to commit when re-releasing an identical tree; the tag and
          # the release still need to happen.
          git diff --cached --quiet || git commit -m "release: v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin HEAD:"${{ github.event.repository.default_branch }}" --follow-tags

      # The release is created last, so a failure above leaves no half-published
      # version for ArtifactHub to pick up.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" "${{ steps.package.outputs.tarball }}" \
            --title "v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes

  publish-package:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-package.yml
    with:
      version: ${{ inputs.version }}
