name: 🔍 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run in flight: without this three pushes in a row
# leave three runs going, and the oldest result lands last.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Formatting is checked separately from lint: the eslint config does not
      # run prettier, so a badly formatted tree passes `npm run lint` happily.
      - name: Format
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run tsc

      # Runs the unit tests once, with coverage. No threshold: only a failing
      # test fails the step, never the percentage.
      - name: Test
        run: |
          npm run coverage | tee "$RUNNER_TEMP/coverage.txt"
          { echo '### Unit-test coverage'; echo '```'; sed -n '/Coverage summary/,$p' "$RUNNER_TEMP/coverage.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/lcov-report
          if-no-files-found: ignore

      - name: Build
        run: npm run build
